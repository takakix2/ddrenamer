# Prove the app builds for Windows -- and, more usefully, run the test suite
# on a real Windows filesystem.
#
# A Windows machine arrived on the LAN on 2026-08-19 (dyna), and the guards were
# finally exercised by hand there. This is no longer the only place that
# happens -- but it is the only place it happens on every push, from a clean
# checkout, without anyone remembering to. That is the job it keeps:
#
#   - the overwrite guard asks same-file for identity because a case-insensitive
#     filesystem reports the rename target as "already existing" when it IS the
#     file being renamed. ext4 is case-sensitive, so that branch does not run
#     on the machine most of this was written on.
#   - the portable-name guard applies Windows' rules on every platform. Note
#     that it is deliberately stricter than this runner: CON.txt is an ordinary
#     file on Windows 11, and the guard refuses it anyway, because older
#     Windows and shares do not agree. Only the bare CON is still a device.
#
# What this does NOT prove: that the app is usable. macOS shipped a build whose
# window drew perfectly and ignored every click, and a green pipeline would have
# said nothing about it. Windows uses the same custom-decoration path as Linux,
# so the shell still needs a pair of hands -- and on 2026-08-19 it got them, on
# dyna: the window drags, the buttons work, and a drop actually renames. That
# hands-on pass found nothing, which is the outcome this file could not have
# reported either way.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Run before the bundle: a rename that eats a file should fail the job in
      # two minutes, not after the installers are built.
      - name: Test on a real Windows filesystem
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Build the bundles
        run: bun run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
