[package]
name = "ddrenamer"
version = "0.6.0"
description = "DDRenamer — Batch File Renaming Tool"
authors = ["takaki2"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ddrenamer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.12.3"
tauri-plugin-clipboard-x = "2.0.1"
# Identity, not spelling: a case-only rename must be told apart from a distinct
# file whose name differs only in case. Unix compares dev+ino, Windows the file
# index. Already in the tree via walkdir, so this costs no extra build.
same-file = "1"


[dev-dependencies]
tempfile = "3"
